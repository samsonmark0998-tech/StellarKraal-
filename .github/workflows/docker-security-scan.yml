name: Docker Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/docker-security-scan.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/docker-security-scan.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  scan:
    name: Scan Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t app-backend:scan ./backend

      - name: Build frontend image
        run: docker build -t app-frontend:scan ./frontend

      - name: Verify containers run as non-root user
        run: |
          set -euo pipefail
          status=0
          for image in app-backend:scan app-frontend:scan; do
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            echo "$image configured user: '${user}'"
            if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ] || [ "$user" = "0:0" ]; then
              echo "::error::Image $image is configured to run as root (user='${user}')"
              status=1
            fi
          done
          exit "$status"

      - name: Run Trivy vulnerability scanner (backend)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: app-backend:scan
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (frontend)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: app-frontend:scan
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload backend scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'trivy-backend'

      - name: Upload frontend scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'trivy-frontend'
